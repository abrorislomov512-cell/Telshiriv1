<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rasimni kurish</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #121212; color: #fff; }
    video, canvas { width: 90%; max-width: 400px; border-radius: 12px; }
    button { margin-top: 15px; padding: 12px 24px; font-size: 16px; font-weight: bold; background: #2481cc; color: white; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <button id="snap">📸 Rasimni kurish</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const snap = document.getElementById('snap');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { alert("Kameraga ruxsat berilmadi!"); });

    snap.addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      
      tg.sendData(JSON.stringify({ image: dataUrl }));
      tg.close();
    });
  </script>
</body>
</html>
